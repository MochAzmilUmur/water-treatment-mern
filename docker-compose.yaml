version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: wtp-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: wtp-database
    ports:
      - "27017:27017"
    volumes:
      - wtp_mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: wtp-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/wtp_db
      - MQTT_BROKER=mqtt://mosquitto:1883
    depends_on:
      - mongodb
      - mosquitto
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wtp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wtp_mongo_data:
